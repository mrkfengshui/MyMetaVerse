<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄學 Apps 跨裝置 UI 模擬器</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1e1e1e; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background-color: #2d2d2d; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; border-right: 1px solid #444; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #121212; overflow: auto; position: relative; }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #4facfe; }
        label { font-size: 13px; color: #aaa; margin-bottom: 4px; display: block; }
        select, input, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #555; background-color: #1e1e1e; color: #fff; font-size: 14px; box-sizing: border-box; }
        select:focus, input:focus { outline: none; border-color: #4facfe; }
        button { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); border: none; color: #000; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .button-group { display: flex; gap: 10px; }
        
        /* 模擬器本體 */
        .simulator-container { transition: transform 0.3s ease; transform-origin: center center; }
        .phone-frame { 
            background-color: #fff; border: 14px solid #000; border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 2px #222;
            overflow: hidden; position: relative; transition: all 0.3s ease;
        }
        /* 模擬瀏海/動態島 */
        .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 25px; background-color: #000; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; display: block; background-color: #fff; }
        
        /* 資訊面板 */
        .info-panel { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>📱 設備 UI 模擬器</h2>
        
        <div>
            <label>測試網址 (App URL)</label>
            <input type="text" id="urlInput" value="http://localhost:3004" placeholder="輸入網址">
        </div>
        
        <div>
            <label>快速切換玄學 App</label>
            <select id="appSelect" onchange="changeApp()">
                <option value="">-- 請選擇並載入 App --</option>
                <option value="https://bazi.mrkfengshui.com">八字 (Bazi)</option>
                <option value="https://zhiwei.mrkfengshui.com">紫微斗數 (Zhiwei)</option>
                <option value="https://qimen.mrkfengshui.com">奇門遁甲 (Qimen)</option>
                <option value="https://calendar.mrkfengshui.com">萬年曆 (Calendar)</option>
                <option value="https://compass.mrkfengshui.com">風水羅盤 (Compass)</option>
                <option value="http://localhost:3004">💻 本機測試 (Localhost:3004)</option>
            </select>
        </div>

        <div>
            <label>選擇設備型號 (Viewport Size)</label>
            <select id="deviceSelect" onchange="updateDevice()">
                <optgroup label="Apple iPhone (2024-2026)">
                    <option value="440,956">iPhone 18 / 17 / 16 Pro Max (440 x 956)</option>
                    <option value="402,874">iPhone 18 / 17 / 16 Pro (402 x 874)</option>
                    <option value="393,852" selected>iPhone 18 / 17 / 16 基本款 (393 x 852)</option>
                    <option value="834,1112">iPhone Duo 折疊展開 (834 x 1112)</option>
                    <option value="393,852">iPhone Duo 外螢幕 (393 x 852)</option>
                </optgroup>
                
                <optgroup label="Samsung Galaxy (最新旗艦與折疊)">
                    <option value="412,915">Galaxy S26 / S25 Ultra (412 x 915)</option>
                    <option value="844,1128">Galaxy Z Fold 8 內螢幕展開 (844 x 1128)</option>
                    <option value="345,850">Galaxy Z Fold 8 外螢幕 (狹長 345 x 850)</option>
                    <option value="412,1080">Galaxy Z Flip 7 展開 (超高 412 x 1080)</option>
                </optgroup>
                
                <optgroup label="Huawei (華為)">
                    <option value="428,926">Huawei Mate 70 / 60 Pro (428 x 926)</option>
                    <option value="960,1100">Huawei Mate XT 三摺展開 (960 x 1100)</option>
                    <option value="600,850">Huawei Mate XT 雙摺型態 (600 x 850)</option>
                </optgroup>

                <optgroup label="Xiaomi / Redmi (小米/紅米)">
                    <option value="412,892">Xiaomi 16 / 15 Pro (412 x 892)</option>
                    <option value="393,852">Xiaomi 16 / 15 (393 x 852)</option>
                    <option value="412,892">Redmi K80 / K70 Pro (412 x 892)</option>
                    <option value="810,1080">Xiaomi Mix Fold 4 展開 (810 x 1080)</option>
                </optgroup>

                <optgroup label="Tablets 平板">
                    <option value="820,1180">iPad Air / iPad Pro 11" (820 x 1180)</option>
                    <option value="1024,1366">iPad Pro 13" (1024 x 1366)</option>
                </optgroup>
            </select>
        </div>

        <div class="button-group">
            <button onclick="rotateDevice()">🔄 旋轉 (橫/直)</button>
            <button onclick="reloadFrame()">重新載入</button>
        </div>

        <div>
            <label>畫面縮放 (Zoom)</label>
            <input type="range" id="zoomSlider" min="0.5" max="1.5" step="0.1" value="0.9" oninput="updateZoom()">
            <div style="text-align: right; font-size: 11px; margin-top: 4px;" id="zoomValue">90%</div>
        </div>
    </div>

    <div class="workspace">
        <div class="simulator-container" id="simContainer">
            <div class="phone-frame" id="phone">
                <div class="notch" id="notch"></div>
                <iframe id="appFrame" src="http://localhost:3004"></iframe>
            </div>
        </div>
        <div class="info-panel" id="info">解析度: 390 x 844</div>
    </div>

    <script>
        let isLandscape = false;
        
        function updateDevice() {
            const dims = document.getElementById('deviceSelect').value.split(',');
            let w = parseInt(dims[0]);
            let h = parseInt(dims[1]);
            
            if (isLandscape) { const temp = w; w = h; h = temp; }
            
            const phone = document.getElementById('phone');
            phone.style.width = w + 'px';
            phone.style.height = h + 'px';
            
            // 橫向時隱藏瀏海
            document.getElementById('notch').style.display = isLandscape ? 'none' : 'block';
            document.getElementById('info').innerText = `解析度: ${w} x ${h}`;
        }

        function rotateDevice() {
            isLandscape = !isLandscape;
            updateDevice();
        }

        function updateZoom() {
            const val = document.getElementById('zoomSlider').value;
            document.getElementById('simContainer').style.transform = `scale(${val})`;
            document.getElementById('zoomValue').innerText = Math.round(val * 100) + '%';
        }

        function changeApp() {
            const selectVal = document.getElementById('appSelect').value;
            if (selectVal) {
                document.getElementById('urlInput').value = selectVal;
                reloadFrame();
            }
        }

        function reloadFrame() {
            const targetUrl = document.getElementById('urlInput').value;
            document.getElementById('appFrame').src = targetUrl;
        }

        // 綁定網址輸入框的 Enter 事件
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') reloadFrame();
        });

        // 初始化
        updateDevice();
        updateZoom();
    </script>
</body>
</html>
